<script>
/* Kampf- und Spielwerte an einer Stelle. Zeiten in Millisekunden. Hier wird die Balance eingestellt. */
const KL=k=>k===" "?"Leertaste":String(k).toUpperCase();
const CFG={
 hero:{
  maxHp:10,            /* Lebenspunkte des Helden */
  dodgeWindow:450,     /* so lange wirken Ausweichen und Ducken */
  dodgeCooldown:900    /* Pause, bis wieder ausgewichen oder geduckt werden kann */
 },

/* Kapitel 3: Der Tag der schwarzen Sonne (nach dem Comic: Verhör durch Colonel Amos, Film vom Attentat auf Präsident William Sheridan, Zelle, Ausbruch, General Carrington).
   Zwei Wege: Amos überzeugen (er lässt dich unter Beobachtung gehen) oder in der Zelle landen und selbst ausbrechen */
addChapter({
images:{
bg_verhoer:{ar:"16:9",p:ST+"Kahler Verhörraum in einem FBI-Büro: Metalltisch mit zwei Stühlen in der Mitte, darauf ein dünner Aktenordner, links ein Fernsehmonitor auf einem Rollwagen, rechts eine große verspiegelte Scheibe, unter der Decke eine Kamera, kaltes Neonlicht."},
bg_zelle:{ar:"16:9",p:ST+"Einfache Haftzelle im Untergeschoss: links eine Pritsche mit dünner Matratze, ein Eimer, hoch an der Wand ein kleines vergittertes Fenster, rechts die Gittertür mit einem Schlosskasten, aus dem bunte Kabel schauen, kaltes Licht."},
bg_flur:{ar:"16:9",p:ST+"Schmaler Wartungsflur im Untergeschoss: Rohre an der Decke, grünliches Notlicht, links ein Verbandskasten an der Wand, rechts ein roter Feuerlöscher, am Ende eine Stahltür mit grüner Notausgangs-Leuchte, kein Text."},
bg_garage:{ar:"16:9",p:ST+"Tiefgarage eines FBI-Gebäudes: Betonpfeiler, mehrere dunkle Dienstwagen, hinten rechts die Rampe nach oben ins Tageslicht, flackernde Neonröhren, kein Text."},
char_amos:{ar:"3:4",p:ST+"Halbfigur-Porträt, FBI-Colonel Amos, Mitte fünfzig, grauer Kurzhaarschnitt, Hemdsärmel hochgekrempelt, Krawatte gelockert, wacher misstrauischer Blick, einfarbiger Hintergrund."},
char_waerter:{ar:"3:4",p:ST+"Halbfigur-Porträt, müder Zellenwärter in hellblauem Hemd, Schlüsselbund am Gürtel, schütteres Haar, einfarbiger Hintergrund."},
char_carrington:{ar:"3:4",p:ST+"Halbfigur-Porträt, General Carrington, Anfang sechzig, weißes Haar, aufrechte militärische Haltung, dunkler Zivilmantel, ruhiger durchdringender Blick, einfarbiger Hintergrund."}},
chars:{
amos:{n:"Colonel Amos",i:"char_amos"},
waerter:{n:"Wärter",i:"char_waerter"},
carrington:{n:"General Carrington",i:"char_carrington"}},
items:{},
scenes:{
verhoer:{bg:"bg_verhoer",chars:["held"],txt:"Handschellen, ein Metalltisch, Neonlicht, das in den Augen sticht. Dir gegenüber sitzt ein Mann in Hemdsärmeln und mustert dich, ohne zu blinzeln: Colonel Amos vom FBI. In der Bank hat er dich aus der Menge gefischt, und er sieht nicht aus, als würde er dich so schnell loslassen.",spots:[
{l:"Colonel Amos",x:50,y:46,t:"talk",to:"v1o",if:"ordner",not:"verhoert"},
{l:"Colonel Amos",x:50,y:46,t:"talk",to:"v1",if:"ohne_ordner",not:"verhoert"},
{l:"Monitor",x:18,y:42,t:"look",once:"monitor",if:"verhoert",msg:"Auf dem Monitor friert ein Bild ein: ein Mann auf einem Dach, ein Gewehr an der Wange, das Gesicht deutlich im Sucher. Du kennst es aus dem Spiegel."},
{l:"Metalltisch",x:50,y:76,t:"look",once:"tisch",msg:"In die Tischplatte hat jemand mit einem Nagel eine römische XIII geritzt. Du bist nicht der Erste, der hier sitzt."},
{l:"Spiegelwand",x:82,y:34,t:"look",once:"spiegel",msg:"Dein Spiegelbild: Verband, Dreitagebart, wilde Augen. Dahinter zählt jemand deine Atemzüge."},
{l:"Wartungsgang",x:14,y:60,t:"go",to:"flur",if:"vertrauen"},
{l:"Abgeführt werden",x:14,y:60,t:"go",to:"zelle",if:"verhoert",not:"vertrauen"}]},
zelle:{bg:"bg_zelle",chars:["held"],txt:"Eine Pritsche, ein Eimer, ein Fenster, durch das kein Mensch passt. Über dir surrt eine Kamera. Ein Wärter lehnt am Gitter und blättert in einer Zeitschrift.",spots:[
{l:"Pritsche",x:18,y:70,t:"look",once:"pritsche",msg:"Unter der Matratze ragt ein schmaler Federstahlstreifen heraus. Damit lässt sich ein Schloss bearbeiten.",give:"Federstahl"},
{l:"Fenster",x:38,y:20,t:"look",once:"fenster",msg:"Draußen ein Stück Beton und ein Stück Himmel. Die Sirenen sind verstummt. Sie haben dich also."},
{l:"Wärter",x:68,y:58,t:"talk",to:"z1",not:"waerter"},
{l:"Schlossverteiler",x:86,y:44,t:"wires",to:"w3",if:"pritsche",not:"tuer"},

flur:{bg:"bg_flur",chars:["held"],txt:"Ein Wartungsflur unter dem Gebäude. Rohre rauschen, das Notlicht färbt alles grün. Hinten wartet die Treppe zur Tiefgarage.",spots:[
{l:"Verbandskasten",x:14,y:52,t:"look",once:"aid3",hp:3,msg:"Du klebst dir ein Pflaster auf die aufgeplatzte Lippe und nimmst einen Schluck aus der Wasserflasche daneben: +3 LP."},
{l:"Notlöscher",x:80,y:58,t:"look",once:"fe2",give:"Feuerlöscher",msg:"An der Wand hängt noch ein roter Feuerlöscher. Du nimmst ihn mit."},
{l:"Treppe zur Tiefgarage",x:52,y:40,t:"go",to:"garage"},
{l:"Zurück zur Zelle",x:50,y:88,t:"go",to:"zelle",not:"vertrauen"}]},
garage:{bg:"bg_garage",chars:["held"],txt:"Beton, Öl und gelbes Licht. Irgendwo schlägt eine Tür zu, Schritte hallen zwischen den Pfeilern. Die Rampe nach oben ist nur noch dreißig Meter entfernt.",spots:[
{l:"Mann im dunklen Anzug",x:34,y:56,t:"talk",to:"g1",not:"frei"},
{l:"Colonel Amos",x:30,y:58,t:"talk",to:"g_amos",if:"vertrauen",once:"amos_g"},
{l:"General Carrington",x:30,y:58,t:"talk",to:"g_carr",if:"frei",not:"vertrauen",once:"carr_g"},
{l:"Dienstwagen",x:60,y:62,t:"go",to:"ende3",if:"frei"},
{l:"Zurück in den Flur",x:12,y:84,t:"go",to:"flur"}]},
ende3:{bg:"bg_garage",chars:["held"],txt:"Du rollst die Rampe hinauf, das Tageslicht schlägt dir ins Gesicht. In den Spiegeln schrumpft das Gebäude. Ein ermordeter Präsident, ein Film mit deinem Gesicht und eine Zahl auf deiner Brust: Kapitel 3 ist geschafft.",spots:[
{l:"Ordner",x:50,y:60,t:"look",once:"ordner_gelesen",if:"ordner",msg:"Zwanzig Zeilen, hinter jedem Namen eine römische Zahl. Zeile XIII ist leer, daneben klebt nur ein Foto von dir. Zeile I ist mit schwarzem Stift geschwärzt, so fest, dass das Papier gerissen ist."},
{l:"Rückspiegel",x:50,y:26,t:"look",once:"rueck3",msg:"Hinter dir wird eine schwarze Limousine kleiner. Sie biegt nicht ab."},
{l:"Weiter zu Kapitel 4",x:50,y:46,t:"go",to:"landstrasse"}]}},
nodes:{
v1o:{who:"amos",say:"Colonel Amos, FBI. Vor zwei Monaten wurde Präsident William Sheridan erschossen, der Tag, den die Zeitungen die schwarze Sonne nennen. Jetzt taucht ein Mann mit einer römischen XIII auf der Haut in einer Bank auf, einen Ordner voller Namen unterm Arm. Erklären Sie mir das.",ch:[
{tag:"Reden",t:"Ich habe keine Erinnerung. Ich bin am Strand aufgewacht, mit einer Kugel im Kopf.",ok:"v2"},
{tag:"Drohen",t:"Ich sage nichts, solange ich keinen Anwalt habe.",ok:"v_bad"}]},
v1:{who:"amos",say:"Colonel Amos, FBI. Zwei Tote in einer Strandhütte, ein Wachmann in der Bank, ein Sprengsatz in Fach 13. Und auf Ihrer Brust steht eine XIII. Wer sind Sie?",ch:[
{tag:"Reden",t:"Ich weiß es nicht. Ich bin am Strand aufgewacht.",ok:"v2"},
{tag:"Flirten",t:"Ein so ruhiger Ton im Verhör, das hatte ich lange nicht.",chk:["Charme",7],ok:"v2",fail:"v_bad"},
{tag:"Drohen",t:"Binden Sie mich los, dann reden wir.",chk:["Stärke",7],ok:"v2",fail:"v_bad"}]},
v2:{who:"amos",say:"Gedächtnisverlust, wie praktisch. Dann sehen Sie sich das an. Er drückt eine Taste. Auf dem Monitor erscheint ein Mann auf einem Dach, ein Schuss, ein Präsident, der zusammenbricht. Das Gesicht des Schützen ist Ihres.",ch:[
{tag:"Reden",t:"Das bin ich nicht, oder ich weiß es nicht. Jemand hat mich in diese Rolle gesteckt.",chk:["Charme",6],ok:"v_ok",fail:"v_bad"},
{tag:"Bestechen",t:"30 Dollar für eine Pause und einen Kaffee.",cost:30,ok:"v_bad"},
{tag:"Drohen",t:"Dann suchen Sie den falschen Mann!",ok:"v_bad"}]},
v_ok:{who:"amos",set:["verhoert","vertrauen","frei"],say:"Ich glaube Ihnen kein Wort. Aber ein Mörder, der sich nicht erinnert, nützt niemandem, und wer Sie erst losschickt, nützt mir vielleicht. Ich lasse Sie gehen, unter Beobachtung. Der Wartungsgang ist nicht verriegelt. Finden Sie heraus, wer Sie sind, bevor es die anderen tun.",ch:[{tag:"Weiter",t:"Danke. Ich werde es herausfinden.",ok:"end"}]},
v_bad:{who:"amos",set:"verhoert",say:"Das reicht. Bringen Sie ihn runter in Zelle vier. Wenn er morgen reden will, soll er klopfen. Die Ärzte kümmern sich um sein Gedächtnis, ich um den Rest.",ch:[{tag:"Weiter",t:"Man führt dich ab.",ok:"end"}]},
z1:{who:"waerter",say:"Was gibt es? Ich habe gleich Schichtwechsel, mach es kurz.",ch:[
{tag:"Reden",t:"Wie lange bleibe ich hier?",ok:"z4"},
{tag:"Flirten",t:"Du siehst aus wie ein Mann, der mal früher Feierabend verdient.",chk:["Charme",7],ok:"z2",fail:"z3"},
{tag:"Bestechen",t:"30 Dollar, und du hast mich nie gesehen.",cost:30,ok:"z2"},
{tag:"Drohen",t:"Mach die Tür auf, oder du bereust es.",chk:["Stärke",7],ok:"z2",fail:"z3"}]},
z2:{who:"waerter",set:["waerter","tuer"],say:"Ich war nie hier. Ich hole mir einen Kaffee, die Kamera hat Aussetzer. Tür ist nur angelehnt.",ch:[{tag:"Weiter",t:"Du bist ein guter Mann.",ok:"end"}]},
z3:{who:"waerter",set:"waerter",say:"Hilfe! Der Gefangene dreht durch!",ch:[{tag:"Weiter",t:"Zwei Wärter stürmen herein!",ok:"fight:f5"}]},
z4:{who:"waerter",say:"Bis morgen früh, dann kommt der Colonel zurück. Der gibt nicht auf, bis er hat, was er will. Das willst du nicht erleben.",ch:[{tag:"Weiter",t:"Dann muss ich vorher weg.",ok:"end"}]},
w3_ok:{who:"held",set:"tuer",say:"Ein Klacken im Schloss, die Gittertür gleitet auf. Die Kamera über dir surrt, aber sie sieht jetzt nur noch eine leere Pritsche.",ch:[{tag:"Weiter",t:"Raus hier.",ok:"end"}]},
w3_bad:{who:"held",say:"Funken, dann ein schriller Alarm! Zwei Wärter stürmen in den Gang.",ch:[{tag:"Weiter",t:"Sie greifen an!",ok:"fight:f5"}]},
f5_win:{who:"held",set:["tuer","waerter"],say:"Beide Wärter liegen am Boden, der Schlüsselbund klirrt über den Boden. Die Zellentür steht offen.",ch:[{tag:"Weiter",t:"Raus hier.",ok:"end"}]},
g1:{who:"fremder",say:"Einer von denen, die dich am Strand jagten. Schalldämpfer, kalte Augen. Er tritt zwischen zwei Pfeilern hervor. Nummer XIII sollte längst tot sein.",ch:[
{tag:"Reden",t:"Wer schickt dich?",ok:"g2"},
{tag:"Drohen",t:"Dann sind wir hier fertig.",ok:"g2"}]},
g2:{who:"fremder",say:"Wer mich schickt, ändert nichts mehr. Es gibt Pläne für dich, und in keinem davon läufst du hier raus.",ch:[{tag:"Weiter",t:"Er stürzt sich auf dich.",ok:"fight:f6"}]},
g_amos:{who:"amos",say:"Dienstwagen, Reihe C. Ich lasse Sie nicht aus den Augen, aber Sie werden mich nicht sehen. Irgendwo sitzt der Mann, der Ihr Gesicht auf diesen Film gesetzt hat. Wenn Sie ihn finden, sind Sie ein Zeuge. Wenn nicht, ein toter Attentäter.",ch:[{tag:"Weiter",t:"Verstanden, Colonel.",ok:"end"}]},
g_carr:{who:"carrington",say:"Ich bin General Carrington. Wir haben uns nie gesehen, merken Sie sich das. Man hat Sie dort unten nicht vergessen, und dieser Wagen steht für Sie bereit. Der Name Ross Tanner könnte Ihnen etwas sagen. Mehr weiß ich noch nicht sicher.",ch:[{tag:"Weiter",t:"Ross Tanner. Ich merke ihn mir.",ok:"end"}]},
f6_win:{who:"held",set:"frei",say:"Der Killer sackt an einem Pfeiler zusammen. Aus dem Schatten tritt ein Mann mit weißem Haar und hält dir einen Wagenschlüssel hin.",ch:[{tag:"Weiter",t:"Du siehst ihn dir an.",ok:"end"}]}},
fights:{
f5:{n:"Zellenwärter",who:"fremder",hp:7,dmg:1,win:"f5_win",lose:"f_lose",waves:[{n:"Erster Wärter",hp:7},{n:"Zweiter Wärter",hp:8}]},
f6:{n:"Attentäter",who:"fremder",hp:11,dmg:1,win:"f6_win",lose:"f_lose"}},
wires:{
w3:{clue:"Am Schlosskasten klebt ein vergilbter Zettel: „Nicht Grün, nicht Weiß, nicht Rot.“",right:2,win:"w3_ok",lose:"w3_bad",colors:[["Rot","#e4412f"],["Grün","#2a9d5c"],["Gelb","#d9a900"],["Weiß","#e8e8e8"]]}}});

/* Kapitel 4: Die Tanner-Farm (frei erfunden im Geist des Comics: Landstraße, Tankstelle mit Hinterhalt, Torschloss, Gespräch mit Walter Tanner) */
addChapter({
images:{
bg_landstrasse:{ar:"16:9",p:ST+"Staubige Landstraße durch flaches gelbes Land, ein dunkler Dienstwagen am Straßenrand mit offener Fahrertür, am Horizont eine Tankstelle mit Neonschild, Strommasten, weiter Himmel, kein Text."},
bg_tankstelle:{ar:"16:9",p:ST+"Kleine Tankstelle mit Diner an einer einsamen Landstraße: zwei Zapfsäulen vorn, ein verbeulter Pickup, links eine Telefonzelle, rechts das Diner mit großem Fenster und flackerndem Neonschild, am Diner ein Erste-Hilfe-Kasten, Abendlicht, kein Text."},
bg_farm:{ar:"16:9",p:ST+"Abgelegene Farm im Abendlicht: eine Windmühle links, eine rote Scheune rechts, im Hintergrund ein Wohnhaus mit Veranda, vorn ein Zaun mit Tor, am Torpfosten ein kleiner Alarmkasten mit bunten Kabeln, ein Briefkasten am Weg, kein Text."},
bg_haus:{ar:"16:9",p:ST+"Wohnzimmer eines alten Farmhauses: Dielenboden, gemauerter Kamin mit Fotos in Rahmen auf dem Sims, rechts ein Schreibtisch mit Schubladen, links ein Fenster mit Abendlicht, Tür nach draußen in der Mitte, kein Text."},
char_dora:{ar:"3:4",p:ST+"Halbfigur-Porträt, Kellnerin Dora, Ende vierzig, rote Schürze, Haare zum Knoten gebunden, müde freundliche Augen, einfarbiger Hintergrund."},
char_walter:{ar:"3:4",p:ST+"Halbfigur-Porträt, alter Farmer Walter Tanner, Ende sechzig, weißer Vollbart, karierte Hemdjacke, verwitterte Haut, misstrauischer Blick, einfarbiger Hintergrund."}},

{l:"Handschuhfach",x:28,y:60,t:"look",once:"hf4",money:40,give:"Straßenkarte",msg:"Im Handschuhfach liegen eine zerknitterte Straßenkarte und zwei Zwanziger. Ein Ort ist mit Kugelschreiber eingekreist: Willow Creek. +40 $."},
{l:"Ordner",x:50,y:72,t:"look",once:"zettel",if:"ordner",msg:"Zwischen den letzten Seiten des Ordners steckt ein Zettel in fremder Handschrift: „R. Tanner, Route 9, hinter Willow Creek. Nicht anrufen.“"},
{l:"Rückspiegel",x:50,y:24,t:"look",if:"vertrauen",msg:"Ein unauffälliger grauer Wagen hält Abstand. Colonel Amos lässt dich nicht aus den Augen, wie versprochen."},
{l:"Rückspiegel",x:50,y:24,t:"look",not:"vertrauen",msg:"Weit hinten hält sich eine schwarze Limousine, immer gleich weit weg. Du glaubst nicht mehr an Zufälle."},

{l:"Pickup",x:36,y:66,t:"look",once:"pick",msg:"Auf der Ladefläche liegen Säcke mit Saatgut und ein Kanister. Der Pickup gehört jemandem, der hier lebt und arbeitet."},

{l:"Schlüssel",x:50,y:60,t:"look",once:"sk",msg:"Am Anhänger steht eine kleine Zahl und ein Ankersymbol. Er gehört zu einem Spind in einem Hafen, sonst steht nichts darauf."},

nodes:{
k1:{who:"kellnerin",say:"Kaffee? Oder suchen Sie etwas anderes? Sie sehen aus, als hätten Sie die Nacht im Straßengraben verbracht.",ch:[
{tag:"Reden",t:"Ich suche einen Mann namens Ross Tanner.",ok:"k2"},
{tag:"Flirten",t:"Für einen Kaffee von Ihnen würde ich auch durch den Graben kriechen.",chk:["Charme",7],ok:"k3",fail:"k4"},
{tag:"Bestechen",t:"30 Dollar, und Sie haben mich nie gesehen.",cost:30,ok:"k3"},
{tag:"Drohen",t:"Sagen Sie mir, wo Tanner wohnt. Sofort.",chk:["Stärke",7],ok:"k3",fail:"k4"}]},
k2:{who:"kellnerin",say:"Der Name macht hier keinem Freude. Das letzte Mal, als jemand nach Tanner fragte, fand man dessen Wagen am Fluss. Leer.",ch:[
{tag:"Reden",t:"Bitte. Es geht um mein Leben. Ich weiß nicht einmal, wer ich bin.",chk:["Charme",5],ok:"k3",fail:"k4"},
{tag:"Drohen",t:"Dann sagen Sie es mir, bevor es jemand anderes tut.",chk:["Stärke",6],ok:"k3",fail:"k4"}]},
k3:{who:"kellnerin",set:"weg",say:"Route 9, dreißig Meilen nach Westen, hinter der Windmühle. Aber wenn Sie ihn finden: Dora vom Diner hat nichts gesagt.",ch:[{tag:"Weiter",t:"Danke, Dora.",ok:"end"}]},
k4:{who:"kellnerin",say:"Ich weiß nicht, wovon Sie reden. Trinken Sie Ihren Kaffee oder gehen Sie.",ch:[{tag:"Weiter",t:"Verstanden.",ok:"end"}]},
k_ok:{who:"kellnerin",say:"Fahren Sie vorsichtig, Namenloser. Die Straße hat Augen.",ch:[{tag:"Weiter",t:"Du auch, Dora.",ok:"end"}]},
k_arr:{who:"fremder",say:"Reifen kreischen auf dem Kies. Die schwarze Limousine bremst vor den Zapfsäulen, zwei Männer steigen aus, die Hände in den Mänteln. Der Erste lächelt kalt: „Nummer XIII. Du solltest längst unter der Erde liegen.“ Hinter dem Fenster erstarrt Dora.",ch:[{tag:"Weiter",t:"Dann holt euch, was ihr wollt.",ok:"fight:f7"}]},
f7_win:{who:"held",set:"ambush",say:"Beide Männer liegen am Boden. Dora liegt hinter dem Tresen, ein Streifschuss am Arm, aber sie atmet. „Fahr,“ keucht sie. „Ich rufe Hilfe.“",ch:[{tag:"Weiter",t:"Ich komme wieder.",ok:"end"}]},
f7_saved:{who:"kellnerin",set:["ambush","dora"],give:"Thermoskanne",say:"Du hast mich gerade noch hinter den Tresen gezogen! Hier, Kaffee für unterwegs. Und fahren Sie, bevor die nächsten kommen.",ch:[{tag:"Weiter",t:"Danke, Dora.",ok:"end"}]},
w4_ok:{who:"held",set:"tor",say:"Das Summen verstummt, das Tor schwingt auf. Auch der Hund bellt nicht mehr.",ch:[{tag:"Weiter",t:"Zum Haus.",ok:"end"}]},
w4_bad:{who:"held",set:["tor","alarm4"],say:"Eine Sirene heult über das Feld! Das Tor springt trotzdem auf, aber jetzt weiß das ganze Haus, dass jemand da ist.",ch:[{tag:"Weiter",t:"Zum Haus, schnell.",ok:"end"}]},
wa1:{who:"walter",say:"Wer sind Sie? Und warum tragen Sie das Gesicht dieses Mörders aus dem Fernsehen? Sprechen Sie, bevor ich es mir anders überlege.",ch:[
{tag:"Reden",t:"Ich bin kein Mörder. Ich suche Ross Tanner.",ok:"wa2"},
{tag:"Drohen",t:"Nehmen Sie das Gewehr runter, alter Mann.",chk:["Stärke",7],ok:"wa3",fail:"wa_f"}]},
wa2:{who:"walter",say:"Ross ist mein Sohn. Seit dem Tag der schwarzen Sonne habe ich nichts mehr von ihm gehört, außer einer Karte mit einem Strand. Und jetzt steht ein Mann in meiner Küche, der aussieht wie die Leute im Fernsehen.",ch:[
{tag:"Reden",t:"Ich habe keine Erinnerung. Ich bin an einem Strand aufgewacht, mit einer XIII auf der Brust.",chk:["Charme",5],ok:"wa3",fail:"wa_f"},
{tag:"Drohen",t:"Ich zeige Ihnen die Zahl. Danach entscheiden Sie.",chk:["Stärke",6],ok:"wa3",fail:"wa_f"}]},
wa_f:{who:"walter",say:"Ein Schuss kracht in die Decke, Putz rieselt. „Das glaube ich Ihnen nicht! Raus, oder der nächste sitzt tiefer!“",ch:[{tag:"Weiter",t:"Ich versuche es noch einmal.",ok:"end"}]},
wa3:{who:"walter",set:"wissen",give:"Spindschlüssel",hp:7,say:"Walter senkt das Gewehr und mustert die Zahl auf deiner Brust. Dann geht er zum Kamin und hebt eine Bodendiele an. Ein Päckchen in Ölpapier. „Ross sagte: Wenn einer kommt mit der Zahl auf der Haut, gib ihm das.“ Er verbindet dir die Hand und stellt eine Tasse Kaffee hin: +LP.",ch:[{tag:"Weiter",t:"Danke, Mr. Tanner.",ok:"end"}]},
wa_ok:{who:"walter",say:"Fahren Sie jetzt. Finden Sie meinen Jungen, oder sagen Sie mir wenigstens, was sie mit ihm gemacht haben.",ch:[{tag:"Weiter",t:"Ich verspreche es.",ok:"end"}]}},
fights:{
f7:{n:"Verfolger",who:"fremder",hp:8,dmg:1,win:"f7_win",lose:"f_lose",rescue:{t:45,who:"kellnerin",win:"f7_saved"},waves:[{n:"Erster Verfolger",hp:8},{n:"Zweiter Verfolger",hp:9}]}},
wires:{
w4:{clue:"Am Alarmkasten klebt ein Zettel in Kinderschrift: „Nicht Rot, nicht Grün, nicht Blau.“",right:3,win:"w4_ok",lose:"w4_bad",colors:[["Rot","#e4412f"],["Grün","#2a9d5c"],["Blau","#2a6fdb"],["Gelb","#d9a900"]]}}});

/* Kapitel 5: Der Hafen (frei erfunden im Geist des Comics: Fisch-Joe, Spind 7, Hinterhalt in der Lagerhalle, Flucht per Kutter) */
addChapter({
images:{
bg_hafen:{ar:"16:9",p:ST+"Kleiner Fischereihafen bei Nacht: Holzpier mit Pollern, ein Fischkutter links am Kai, im Hintergrund Kräne und Container, rechts am Pierende eine kleine Hafenmeisterei mit grüner Tür und Lampe, ein Verbandskasten an einem Pfosten, Nebelschwaden, kein Text."},
bg_meisterei:{ar:"16:9",p:ST+"Enge Hafenmeisterei innen: links eine Wand aus nummerierten Metallspinden, einer davon mit einem kleinen Zahlenschloss und herausschauenden bunten Kabeln, in der Mitte ein Schreibtisch mit Lampe und Seekarten, rechts eine Hintertür, gelbes Licht, kein Text."},
bg_lager:{ar:"16:9",p:ST+"Große Lagerhalle am Hafen: hohe Regale mit Kisten, ein Gabelstapler, links ein Erste-Hilfe-Kasten an einer Säule, hinten ein großes Ladetor einen Spalt breit offen mit Nebellicht davor, Stahlträger, kein Text."},
char_joe:{ar:"3:4",p:ST+"Halbfigur-Porträt, Fischer Fisch-Joe, Mitte fünfzig, Ölzeugjacke, Wollmütze, grauer Bart, wettergegerbtes Gesicht, einfarbiger Hintergrund."}},
chars:{
fischer:{n:"Fisch-Joe",i:"char_joe"}},
items:{},
scenes:{
hafen:{bg:"bg_hafen",chars:["held"],txt:"Der Hafen riecht nach Teer, Salz und Diesel. Kräne ragen in den Nachthimmel, Wellen klatschen gegen den Kai. Der Anker auf dem Schlüsselanhänger passt zu einer kleinen Hafenmeisterei am Ende des Piers. Davor sitzt ein Mann auf einem Poller und flickt ein Netz.",spots:[
{l:"Fisch-Joe",x:30,y:62,t:"talk",to:"fi1",not:"offen"},
{l:"Fisch-Joe",x:30,y:62,t:"talk",to:"fi_ok",if:"offen"},
{l:"Verbandskasten",x:58,y:50,t:"look",once:"aid5",hp:3,msg:"Am Pfosten hängt ein Verbandskasten. Du versorgst die Hand: +3 LP."},
{l:"Zettel am Poller",x:42,y:78,t:"look",once:"doragruss",if:"dora",money:20,msg:"Unter einem Stein klemmt ein Umschlag in Doras Handschrift: „Fisch-Joe nimmt dich mit. D.“ Darin stecken 20 Dollar. +20 $."},
{l:"Container",x:76,y:38,t:"look",once:"cont",msg:"Zwischen den Containern flackert ein Licht. Jemand beobachtet den Pier, ohne sich zu zeigen."},
{l:"Hafenmeisterei",x:88,y:50,t:"go",to:"meisterei",if:"offen"},
{l:"Fischkutter",x:12,y:52,t:"go",to:"ende5",if:"lager_ok"}]},
meisterei:{bg:"bg_meisterei",chars:["held"],txt:"Eng, warm und ölig. An der Wand zählen Spinde ihre Nummern, der siebte hat ein Zahlenschloss und lose Kabel. Auf dem Schreibtisch liegen Seekarten, dahinter schnarcht irgendwo ein Wachmann.",spots:[
{l:"Schreibtisch",x:50,y:62,t:"look",once:"sch5",money:25,msg:"In einer Schublade liegt Kleingeld für die Hafenkasse. Du steckst 25 Dollar ein. +25 $."},
{l:"Spindwand",x:20,y:44,t:"look",once:"wand",msg:"Sechs Spinde sind leer, aufgebrochen und ausgeräumt. Nur Nummer 7 hat noch ein Schloss."},
{l:"Spind 7",x:20,y:64,t:"wires",to:"w5",not:"spind"},
{l:"Hintertür zur Lagerhalle",x:86,y:56,t:"go",to:"lager",if:"spind"},
{l:"Zurück auf den Pier",x:50,y:90,t:"go",to:"hafen"}]},
lager:{bg:"bg_lager",chars:["held"],txt:"Regale voller Kisten, ein Gabelstapler, Staub im Neonlicht. Am Ladetor steht ein schmaler Spalt offen, Nebel kriecht herein. Irgendwo knirscht Kies unter schweren Schuhen.",spots:[
{l:"Erste-Hilfe-Kasten",x:14,y:56,t:"look",once:"aid6",hp:3,msg:"Der Kasten an der Säule ist fast voll. Du versorgst dich: +3 LP."},
{l:"Gabelstapler",x:44,y:70,t:"look",once:"stapler",msg:"Die Schlüssel stecken, aber die Batterie ist leer. Zum Fliehen taugt er nicht."},
{l:"Ladetor",x:76,y:50,t:"talk",to:"l_arr",not:"lager_ok"},
{l:"Zum Pier",x:76,y:50,t:"go",to:"hafen",if:"lager_ok"},
{l:"Zurück zur Meisterei",x:12,y:88,t:"go",to:"meisterei",not:"lager_ok"}]},
ende5:{bg:"bg_hafen",chars:["held"],txt:"Der Kutter schiebt sich aus dem Hafen, die Lichter der Stadt werden kleiner. Joe steht am Ruder und pfeift falsch. Im Spind lag alles, was Ross zurückgelassen hat, und es führt aufs Meer hinaus. Kapitel 5 ist geschafft.",spots:[
{l:"Seekarte",x:50,y:60,t:"look",once:"karte5",msg:"Auf der Karte ist ein einzelner Punkt eingekreist: ein Leuchtturm auf einem Felsen draußen im Meer. Daneben hat jemand mit Bleistift eine römische Zahl gekritzelt."},
{l:"Foto",x:30,y:70,t:"look",once:"foto5",msg:"Ein Foto zeigt Ross Tanner an Deck eines Schiffes. Er lacht, die Narbe am Kinn kennst du aus dem Spiegel."},
{l:"Weiter zu Kapitel 6",x:50,y:40,t:"look",msg:"Kapitel 6 ist noch nicht gebaut. Sag Bescheid, wenn es weitergehen soll!"}]}},
nodes:{
fi1:{who:"fischer",say:"Der Pier ist für Angler und Fischer. Du siehst aus wie keins von beiden. Was willst du?",ch:[
{tag:"Reden",t:"Ich habe einen Schlüssel mit einem Anker darauf.",ok:"fi2"},
{tag:"Bestechen",t:"20 Dollar, und du siehst weg.",cost:20,ok:"fi3"},
{tag:"Drohen",t:"Mach Platz, Alter. Ich muss in die Meisterei.",chk:["Stärke",6],ok:"fi3",fail:"fi4"}]},
fi2:{who:"fischer",say:"Ein Anker... Das ist Ross' Schlüssel. Er hat mir verboten, ihn jemandem zu geben. Aber Ross ist seit Wochen weg. Wer schickt dich?",ch:[
{tag:"Reden",t:"Sein Vater Walter. Und ich bin der, den sie im Fernsehen suchen.",chk:["Charme",5],ok:"fi3",fail:"fi4"},
{tag:"Drohen",t:"Du kennst mein Gesicht. Willst du wirklich mit mir streiten?",chk:["Stärke",6],ok:"fi3",fail:"fi4"}]},
fi3:{who:"fischer",set:"offen",say:"Die grüne Tür am Ende des Piers. Der Wachmann schläft bis Mitternacht. Spind 7 gehört Ross. Mein Kutter liegt bereit, wenn du fertig bist.",ch:[{tag:"Weiter",t:"Danke, Joe.",ok:"end"}]},
fi4:{who:"fischer",say:"Ich kenne dich nicht. Ich habe nichts gesehen und nichts gehört. Geh dein Netz flicken.",ch:[{tag:"Weiter",t:"Ich versuche es später noch einmal.",ok:"end"}]},
fi_ok:{who:"fischer",say:"Spind 7, dann zurück zu mir. Mein Kutter wartet. Aber wenn du Schüsse hörst, bin ich nicht schuld.",ch:[{tag:"Weiter",t:"Verstanden.",ok:"end"}]},
w5_ok:{who:"held",set:"spind",give:"Seekarte",say:"Das Schloss gibt leise nach. Im Spind liegen eine Seekarte und ein Foto von Ross Tanner an Deck eines Schiffes. Er sieht dir ähnlicher, als dir lieb ist.",ch:[{tag:"Weiter",t:"Weg hier, bevor jemand kommt.",ok:"end"}]},
w5_bad:{who:"held",set:["spind","alarm5"],give:"Seekarte",say:"Ein Funke, ein schrilles Piepen im ganzen Gebäude! Der Spind springt trotzdem auf: Seekarte und Foto. Aber draußen springt ein Motor an.",ch:[{tag:"Weiter",t:"Weg hier, schnell.",ok:"end"}]},
l_arr:{who:"fremder",say:"Das Ladetor kracht auf. Drei Männer drängen herein, Taschenlampen im Nebel. Der Anführer grinst: „Kleiner Spaziergang, Nummer XIII? Der war schon lange fällig.“ Hinter einer Kiste duckt sich Joe, der dir gefolgt ist.",ch:[{tag:"Weiter",t:"Dann los.",ok:"fight:f9"}]},
f9_win:{who:"held",set:"lager_ok",say:"Alle drei liegen im Staub. Joe ist mit einer Schramme davongekommen, der Rückweg zum Pier ist frei.",ch:[{tag:"Weiter",t:"Zum Kutter.",ok:"end"}]},
f9_saved:{who:"fischer",set:["lager_ok","joe5"],say:"Danke, Namenloser! Ohne dich hätten die mich erwischt. Los, aufs Boot, bevor es hier von denen wimmelt.",ch:[{tag:"Weiter",t:"Zum Kutter.",ok:"end"}]}},

/* Kern: Zustand, Szenen, Hotspots, Dialoge und Proben, Darstellung von Szene und Dialog */
const TC={Reden:"#2a6fdb",Flirten:"#d63384",Bestechen:"#2a9d5c",Drohen:"#c0392b",Weiter:"#555"};
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const d6=()=>1+Math.floor(Math.random()*6),CHS={strand:1,strasse:2,verhoer:3,landstrasse:4,hafen:5},snap=s=>({scene:s.scene,hp:s.hp,money:s.money,inv:[...s.inv],floor:[...s.floor],flags:{...s.flags}}),
fresh=()=>{const s={scene:P.start,hp:CFG.hero.maxHp,money:60,inv:[],floor:[],flags:{},mode:"scene",node:null,msg:"",fx:"",f:null,w:null,ch:CHS[P.start]||1};s.ck=snap(s);return s};
function restartChapter(){clearInterval(tm);fightStop();const c=S.ck,n=S.ch;S={...fresh(),...snap(c),ck:snap(c),ch:n,msg:"Kapitel "+n+" beginnt von vorn."};render()}
let S,urls={},db=null,tm=null,showImg=false,sv={};
const vis=s=>(!s.if||S.flags[s.if])&&(!s.not||!S.flags[s.not])&&!(s.once&&S.flags[s.once]);
const por=(id,on)=>{const c=P.chars[id],u=urls[c.i];return `<div class="por${on?" on":""}">${u?`<img src="${u}" alt="">`:E(c.n[0])}<b>${E(c.n)}</b></div>`};
function render(){
 const sc=P.scenes[S.scene],u=urls[sc.bg],app=$("#app");
 if(S.mode==="fight")return fightRender(sc,u,app);
 if(S.hp<=0&&!S.busy&&S.mode!=="fight"){app.innerHTML=`<div class="box"><h2>K.O.!</h2><p>Deine Lebenspunkte sind aufgebraucht.</p><button class="btn" data-a="rc">Kapitel ${S.ch} neu beginnen</button> <button class="btn" data-a="rs">Ganz neu beginnen</button></div>`;rpan();return}
 let n=null,spk=null,who=sc.chars||[];
 if(S.mode==="dialog"){n=P.nodes[S.node];spk=n.who;who=[...new Set(["held",n.who])]}
 else if(S.mode==="fight"){who=[]}
 let h=`<div class="top"><h1>${P.title}</h1><div><button class="btn" data-a="bi">Bilder</button> <button class="btn" data-a="rc">Kapitel ${S.ch} neu</button> <button class="btn" data-a="rs">Neustart</button></div></div>`;
 h+=`<div class="stage"${u?` style="background-image:url('${u}')"`:""}>${u?"":`<i class="miss">Bild fehlt: ${sc.bg}</i>`}`;
 if(S.mode==="scene")sc.spots.forEach((s,i)=>{if(vis(s))h+=`<button class="spot" style="left:${s.x}%;top:${s.y}%" data-a="spot" data-i="${i}">${E(s.l)}</button>`});
 
 h+=`<div class="chars">${who.map(c=>por(c,c===spk)).join("")}</div>${S.fx?`<div class="fx">${S.fx}</div>`:""}</div>`;
 if(S.mode==="scene")h+=`<div class="cap">${E(sc.txt)}</div>`+(S.floor.length?`<div class="row">${S.floor.map((n,i)=>`<button class="btn" data-a="pk" data-i="${i}">Aufheben: ${E(n)}</button>`).join("")}</div>`:"");
 if(S.mode==="dialog"){h+=`<div class="bubble"><b>${E(P.chars[n.who].n)}</b><p>${E(n.say)}</p></div><div class="chs">`+n.ch.map((c,i)=>`<button class="ch" data-a="ch" data-i="${i}"><em class="tag" style="background:${TC[c.tag]||"#555"}">${c.tag}</em>${E(c.t)}${c.cost?` <small>(−${c.cost} $)</small>`:""}${c.chk?` <small>(Probe: ${c.chk[0]})</small>`:""}</button>`).join("")+`</div>`}
 
 if(S.mode==="wires"){const w=S.w;h+=`<div class="cap">${E(w.clue)} Noch <b id="tm">${w.t}</b> Sekunden.</div><div class="wires">`+w.colors.map((c,i)=>`<button class="wire" style="background:${c[1]}" data-a="cut" data-i="${i}">${c[0]}<br>kappen</button>`).join("")+`</div>`}
 if(S.msg)h+=`<div class="msg">${E(S.msg)}</div>`;
 h+=`<div class="st">LP ${Math.max(0,S.hp)}/${CFG.hero.maxHp} · ${S.money} $ · Inventar: ${S.inv.length?E(S.inv.join(", ")):"leer"} · Stärke ${P.stats.Stärke}, Charme ${P.stats.Charme}, Geschick ${P.stats.Geschick}</div>`;
 app.innerHTML=h;rpan();
}
function goNode(n){
 clearInterval(tm);fightStop();
 if(!n||n==="end"){S.mode="scene";S.node=null}
 else if(n.startsWith("fight:")){const f=P.fights[n.slice(6)];fightStart(f)}
 else{const o=P.nodes[n];S.mode="dialog";S.node=n;if(o.set)[].concat(o.set).forEach(k=>S.flags[k]=1);if(o.give&&!S.inv.includes(o.give))S.inv.push(o.give);if(o.hp)S.hp=Math.max(S.hp,o.hp)}
 render();
}
function spot(i){const s=P.scenes[S.scene].spots[i];S.msg="";
 if(s.t==="go"){S.scene=s.to;if(CHS[s.to]){S.ch=CHS[s.to];S.ck=snap(S)}render()}
 else if(s.t==="talk")goNode(s.to);
 else if(s.t==="wires"){const w=P.wires[s.to];S.w={...w,t:CFG.wires.time[s.to]??CFG.wires.defaultTime};S.mode="wires";clearInterval(tm);tm=setInterval(()=>{S.w.t--;const e=$("#tm");if(e)e.textContent=S.w.t;if(S.w.t<=0){S.msg="Zeit abgelaufen!";goNode(S.w.lose)}},1000);render()}
 else{S.msg=s.msg;if(s.once)S.flags[s.once]=1;if(s.money)S.money+=s.money;if(s.hp)S.hp=Math.min(CFG.hero.maxHp,S.hp+s.hp);if(s.give&&!S.inv.includes(s.give))S.inv.push(s.give);render()}}
function pick(c){
 if(c.cost&&S.money<c.cost){S.msg="Du hast nicht genug Geld.";return render()}
 if(c.cost)S.money-=c.cost;
 let ok=true,r="";
 if(c.chk){const d=d6(),v=P.stats[c.chk[0]];ok=d+v>=c.chk[1];r=`${c.chk[0]}-Probe: ${d} + ${v} ${ok?"≥":"<"} ${c.chk[1]}, ${ok?"geschafft":"misslungen"}.`}
 S.msg=r;goNode(ok?c.ok:c.fail||c.ok);}

/* Bilder: Speicherung (IndexedDB), Freistellen, Upload-Fenster, fest eingebaute Bilder */
const st=id=>stx(id)+cutS(id);

function cutPx(p,w,h){const n=w*h,seen=new Uint8Array(n),st=[],cs=[0,w-1,(h-1)*w,(h-1)*w+w-1].map(i=>i*4);let r=0,g=0,b=0;cs.forEach(i=>{r+=p[i];g+=p[i+1];b+=p[i+2]});r/=4;g/=4;b/=4;
 const push=i=>{if(!seen[i]&&Math.abs(p[i*4]-r)+Math.abs(p[i*4+1]-g)+Math.abs(p[i*4+2]-b)<120){seen[i]=1;st.push(i)}};
 for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
 let cnt=0;while(st.length){const i=st.pop(),x=i%w,y=(i/w)|0;p[i*4+3]=0;cnt++;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}
 return cnt/n}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="spot")spot(i);else if(a==="ch")pick(P.nodes[S.node].ch[i]);else if(a==="act")fAct(b.dataset.k);else if(a==="pk"){const n=S.floor.splice(i,1)[0];if(n){S.inv.push(n);S.msg="Aufgehoben: "+n}render()}else if(a==="cut")cut(i);
 else if(a==="rc")restartChapter();else if(a==="rs"){clearInterval(tm);fightStop();S=fresh();render()}else if(a==="bi"){showImg=true;render()}else if(a==="close"){showImg=false;render()}
 else if(a==="copy"){const t=Object.entries(P.images).map(([id,m])=>`${id} (${m.ar}): ${m.p}`).join("\n\n");try{navigator.clipboard.writeText(t).then(()=>b.textContent="Kopiert",()=>b.textContent="Kopieren nicht möglich")}catch(x){b.textContent="Kopieren nicht möglich"}}});

document.addEventListener("keydown",e=>{if(!S||S.mode!=="fight"||e.ctrlKey||e.metaKey||e.altKey)return;const K=CFG.keys,k=e.key.length>1?e.key:e.key.toLowerCase(),
 m={[K.headL]:"pl",[K.headR]:"pr",[K.bodyL]:"bl",[K.bodyR]:"br",[K.throw]:"te",[K.dodgeL]:"dl",[K.dodgeR]:"dr",[K.duck]:"du",[K.ko]:"ko"}[k];
 if(m){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();fAct(m)}});
