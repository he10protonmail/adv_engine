<script>
const ST="Bildstil: franko-belgischer Thriller-Comic, kräftige schwarze Konturen, flächige Farben, Cel-Shading, kein Text im Bild. ";
const BD="Frontale Ganzkörperansicht, die Person steht aufrecht zur Kamera, Kopf im obersten Fünftel des Bildes, Fäuste in Boxerhaltung vor dem Körper, dieselbe Figur und Kleidung wie im Porträt, reiner weißer Hintergrund ohne Boden und ohne Schatten. Gesicht groß und gut erkennbar, die Augen liegen bei etwa 9 Prozent der Bildhöhe, Kopf mittig. ";
const P={title:"XIII · Kapitel 1: Der Strand",start:"strand",stats:{Stärke:3,Charme:2,Geschick:3},
images:{
bg_strand:{ar:"16:9",p:ST+"Einsamer Strand bei Morgendämmerung, Treibgut und Algen im Vordergrund, Wellen links, kleine Holzhütte rechts im Hintergrund, leichter Nebel."},
bg_huette:{ar:"16:9",p:ST+"Innenraum einer Rettungshütte am Strand: Verbandskasten an der Wand links, Kabelkasten daneben, ein Fenster rechts mit Blick auf einen Parkplatz, Hintertür ganz rechts, Spind, Rettungsring, warmes Licht."},
bg_parkplatz:{ar:"16:9",p:ST+"Kiesparkplatz hinter einer Strandhütte, ein altes Lieferfahrzeug mit offener Fahrertür in der Mitte, Zaun und Dünen im Hintergrund, Dämmerlicht."},
char_held:{ar:"3:4",p:ST+"Halbfigur-Porträt, Mann Mitte dreißig, kurze dunkle Haare, markantes Kinn, verwirrter Blick, nasses zerrissenes Hemd, auf der Brust ein Brandzeichen mit der römischen Zahl XIII, einfarbiger Hintergrund."},
char_retterin:{ar:"3:4",p:ST+"Halbfigur-Porträt, junge Rettungsschwimmerin, kurze braune Haare, rotes Shirt, sonnengebräunt, besorgt und freundlich, einfarbiger Hintergrund."},
char_fremder:{ar:"3:4",p:ST+"Halbfigur-Porträt, Mann im schwarzen Anzug mit Sonnenbrille, harte Miene, schmale Lippen, einfarbiger Hintergrund."},

function cutPx(p,w,h){const n=w*h,seen=new Uint8Array(n),st=[],cs=[0,w-1,(h-1)*w,(h-1)*w+w-1].map(i=>i*4);let r=0,g=0,b=0;cs.forEach(i=>{r+=p[i];g+=p[i+1];b+=p[i+2]});r/=4;g/=4;b/=4;
 const push=i=>{if(!seen[i]&&Math.abs(p[i*4]-r)+Math.abs(p[i*4+1]-g)+Math.abs(p[i*4+2]-b)<120){seen[i]=1;st.push(i)}};
 for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
 let cnt=0;while(st.length){const i=st.pop(),x=i%w,y=(i/w)|0;p[i*4+3]=0;cnt++;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}

async function cutout(file){const im=await createImageBitmap(file),k=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(im,0,0,w,h);const d=g.getImageData(0,0,w,h);cutout.last=null;if(d.data[3]<10)return file;const pct=cutPx(d.data,w,h);if(pct>.92){cutout.last=-1;return file}cutout.last=Math.round(pct*100);g.putImageData(d,0,0);return new Promise(res=>c.toBlob(res,"image/png"))}
