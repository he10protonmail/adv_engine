<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comic-Plot-Engine · Test mit XIII</title>
  <style>
    :root {
      --bg: #cfe8ef;
      --ink: #1b1a2e;
      --card: #fffdf4;
      --acc: #e4412f;
      --sun: #ffd23f;
      --sea: #1f6f78;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.45 "Comic Neue", "Trebuchet MS", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .wrap {
      width: min(920px, calc(100vw - 20px));
      padding: 10px 0 18px;
    }
    .app {
      background: transparent;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    h1, h2, .spot, .fx {
      font-family: Bangers, Impact, sans-serif;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
    }
    .btn {
      font: 700 15px/1.2 "Comic Neue", sans-serif;
      color: var(--ink);
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 8px;
      box-shadow: 3px 3px 0 var(--ink);
      padding: 9px 12px;
      cursor: pointer;
    }
    .btn:hover { background: var(--sun); }
    .btn:focus-visible, .spot:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .stage {
      position: relative;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.1)), var(--sea);
      border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.08);
      pointer-events: none;
    }
    .spot {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--sun);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      font-size: clamp(15px, 2vw, 20px);
      z-index: 2;
    }
    .spot:hover { background: var(--acc); color: white; }
    .chars {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .portrait {
      width: 84px;
      aspect-ratio: 3 / 4;
      border: 3px solid var(--ink);
      background: var(--card);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .portrait.active {
      outline: 4px solid var(--sun);
      transform: translateY(-6px);
    }
    .portrait b {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: rgba(27,26,46,.92);
      color: white;
      font-size: 11px;
      text-align: center;
      padding: 2px 4px;
      line-height: 1.2;
      font-family: Bangers, Impact, sans-serif;
      letter-spacing: 0.04em;
    }
    .portrait .letter {
      font-family: Bangers, Impact, sans-serif;
      font-size: 34px;
      color: var(--ink);
    }
    .fx {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%) rotate(-8deg);
      color: var(--sun);
      font-size: clamp(42px, 12vw, 90px);
      -webkit-text-stroke: 3px var(--ink);
      text-shadow: 5px 5px 0 var(--acc);
      z-index: 3;
      pointer-events: none;
      animation: pop .9s ease both;
    }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
      30% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-8deg); }
    }
    .caption, .bubble, .message {
      margin-top: 14px;
      max-width: 70ch;
    }
    .caption {
      background: var(--sun);
      border: 3px solid var(--ink);
      padding: 8px 12px;
      font-weight: 700;
    }
    .bubble {
      position: relative;
      background: white;
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 10px 16px;
      max-width: 70ch;
    }
    .bubble::after {
      content: "";
      position: absolute;
      top: -16px;
      left: 32px;
      border: 10px solid transparent;
      border-top: 0;
      border-bottom: 16px solid var(--ink);
    }
    .bubble strong {
      display: block;
      margin-bottom: 4px;
    }
    .message {
      color: var(--acc);
      font-weight: 700;
      min-height: 28px;
    }
    .choices {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      max-width: 70ch;
    }
    .choice {
      text-align: left;
    }
    .tag {
      display: inline-block;
      color: white;
      background: #555;
      border-radius: 5px;
      padding: 4px 8px;
      margin-right: 8px;
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }
    .stats {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.5;
      padding-top: 10px;
      border-top: 2px dashed var(--ink);
    }
    .inventory {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app" class="app" aria-live="polite"></div>
  </div>

  <script>
    const STORY = {
      title: 'XIII · Kapitel 1: Der Strand',
      start: 'strand',
      scenes: {
        strand: {
          bg: 'linear-gradient(180deg, rgba(13,22,40,.18), rgba(10,24,31,.25)), url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80")',
          text: 'Du kommst zu dir. Sand im Mund, Salz auf den Lippen, ein Pochen im Kopf. Du weißt nicht, wer du bist. Nur eine Frau steht am Wasser und starrt dich an.',
          chars: ['held'],
          spots: [
            { label: 'Frau am Wasser', x: 24, y: 62, action: 'talk', node: 'n1' },
            { label: 'Brust', x: 48, y: 72, action: 'look', flag: 'tattoo', message: 'Auf deiner Brust brennt eine römische Zahl: XIII. Frisch genug, um zu schmerzen.' },
            { label: 'Hosentasche', x: 64, y: 78, action: 'look', flag: 'key', item: 'Schlüssel', message: 'In der Hosentasche steckt ein Schlüsssel mit Nummer. Du behältst ihn.' },
            { label: 'Treibgut', x: 58, y: 82, action: 'look', flag: 'flask', item: 'Flasche', message: 'Zwischen den Algen liegt eine leere Glasflasche. Die könnte noch nützlich sein.' },
            { label: 'Rettungshütte', x: 80, y: 46, action: 'goto', target: 'huette' }
          ]
        },
        huette: {
          bg: 'linear-gradient(180deg, rgba(15,18,26,.16), rgba(15,18,26,.28)), url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80")',
          text: 'In der Hütte riecht es nach Salz, Öl und Pflaster. Draußen schreien Möwen. Alles wirkt friedlich, und trotzdem ist dir mulmig.',
          chars: ['held'],
          spots: [
            { label: 'Verbandskasten', x: 22, y: 48, action: 'look', flag: 'aid', message: 'Du presst dir einen Verband an den Kopf. Das Pochen lässt nach: +3 LP.', heal: 3 },
            { label: 'Fenster', x: 62, y: 30, action: 'look', flag: 'alarm', message: 'Auf dem Parkplatz hält ein schwarzer Wagen. Zwei Männer steigen aus, einer trägt etwas Langes unter dem Mantel.' },
            { label: 'Retterin', x: 42, y: 64, action: 'talk', node: 'h1' },
            { label: 'Vom Strand', x: 54, y: 88, action: 'goto', target: 'strand' }
          ]
        }
      },
      chars: {
        held: { name: 'Du', initial: 'D' },
        retterin: { name: 'Retterin', initial: 'R' }
      },
      nodes: {
        n1: {
          speaker: 'retterin',
          text: 'Er lebt! Bleib liegen, du blutest am Kopf. Weißt du, wie du heißt?',
          choices: [
            { tag: 'Reden', text: 'Nein. In meinem Kopf ist nichts.', next: 'n2' },
            { tag: 'Flirten', text: 'Wenn mich jemand so pflegt, bleibe ich gern liegen.', next: 'n3', stat: 'Charme', req: 6 },
            { tag: 'Drohen', text: 'Kein Wort zu irgendwem, verstanden?', next: 'n4', stat: 'Stärke', req: 5 }
          ]
        },
        n2: {
          speaker: 'retterin',
          text: 'Eine römische XIII auf der Brust und ein Loch im Kopf... Komm in die Hütte, ich verbinde dich.',
          choices: [{ tag: 'Weiter', text: 'Danke. Ich komme mit.', next: 'end' }]
        },
        n3: {
          speaker: 'retterin',
          text: 'Ein Charmeur mit Gedächtnisverlust, das fehlte noch. Na komm, in die Hütte gibt es einen Verband.',
          choices: [{ tag: 'Weiter', text: 'Ich bin schon unterwegs.', next: 'end' }]
        },
        n4: {
          speaker: 'retterin',
          text: 'Lass das! Ich will dir doch nur helfen. In die Hütte, sofort!',
          choices: [{ tag: 'Weiter', text: 'Na gut.', next: 'end' }]
        },
        h1: {
          speaker: 'retterin',
          text: 'Draußen steht ein schwarzer Wagen. Die Männer sehen nicht aus wie Badegäste. Kennst du die? Ich rufe die Polizei!',
          choices: [
            { tag: 'Reden', text: 'Nicht! Die sind meinetwegen hier. Versteck dich.', next: 'end' },
            { tag: 'Drohen', text: 'Leg das Telefon weg. Sofort.', next: 'end', stat: 'Stärke', req: 5 }
          ]
        }
      }
    };

    const state = {
      scene: STORY.start,
      hp: 10,
      money: 60,
      inventory: [],
      flags: {},
      message: 'Du bist wach. Was tust du?',
      node: null,
      mode: 'scene'
    };

    function render() {
      const app = document.getElementById('app');
      const scene = STORY.scenes[state.scene];
      if (!scene) return;

      const chars = scene.chars || [];
      const portraits = chars.map((id) => {
        const person = STORY.chars[id];
        return `
          <div class="portrait ${state.node && STORY.nodes[state.node].speaker === id ? 'active' : ''}">
            <span class="letter">${person.initial}</span>
            <b>${person.name}</b>
          </div>
        `;
      }).join('');

      const spots = (scene.spots || []).filter((spot) => {
        if (spot.flag && state.flags[spot.flag]) return false;
        return true;
      }).map((spot, index) => `
        <button type="button" class="spot" style="left:${spot.x}%; top:${spot.y}%" data-action="spot" data-index="${index}">${spot.label}</button>
      `).join('');

      const inventory = state.inventory.length
        ? `<div class="inventory">${state.inventory.map(item => `<span class="chip">${item}</span>`).join('')}</div>`
        : `<div class="inventory"><span class="chip">leer</span></div>`;

      let dialog = '';
      if (state.mode === 'dialog' && state.node) {
        const node = STORY.nodes[state.node];
        const speaker = STORY.chars[node.speaker] || { name: 'Narrator' };
        dialog = `
          <div class="bubble">
            <strong>${speaker.name}</strong>
            <div>${node.text}</div>
          </div>
          <div class="choices">
            ${node.choices.map((choice, idx) => `
              <button type="button" class="btn choice" data-action="choice" data-index="${idx}">
                <span class="tag" style="background:${colorFor(choice.tag)}">${choice.tag}</span>${choice.text}
              </button>
            `).join('')}
          </div>
        `;
      }

      app.innerHTML = `
        <div class="topbar">
          <h1>${STORY.title}</h1>
          <div>
            <button type="button" class="btn" data-action="restart">Neustart</button>
          </div>
        </div>

        <div class="stage" style="background-image:${scene.bg}">
          ${spots}
          <div class="chars">${portraits}</div>
          ${state.fx ? `<div class="fx">${state.fx}</div>` : ''}
        </div>

        <div class="caption">${scene.text}</div>

        ${dialog}

        <div class="message">${state.message || ''}</div>
        <div class="stats">
          LP: ${Math.max(0, state.hp)}/10 &nbsp;•&nbsp; Geld: ${state.money} $ &nbsp;•&nbsp; Inventar:
          ${inventory}
        </div>
      `;
    }

    function colorFor(tag) {
      const map = {
        Reden: '#2a6fdb',
        Flirten: '#d63384',
        Drohen: '#c0392b',
        Bestechen: '#2a9d5c',
        Weiter: '#555',
        '': '#666'
      };
      return map[tag] || '#666';
    }

    function giveItem(item) {
      if (!item) return;
      if (!state.inventory.includes(item)) state.inventory.push(item);
    }

    function applyChoice(index) {
      if (!state.node) return;
      const node = STORY.nodes[state.node];
      const choice = node.choices[index];
      if (!choice) return;

      const needsStat = choice.stat;
      if (needsStat) {
        const statValue = { Stärke: 3, Charme: 2, Geschick: 3 }[needsStat] || 0;
        const roll = 1 + Math.floor(Math.random() * 6);
        const passed = roll + statValue >= (choice.req || 0);
        state.message = `${needsStat}-Probe: ${roll} + ${statValue} ${passed ? '≥' : '<'} ${choice.req}. ${passed ? 'Erfolgreich.' : 'Misslungen.'}`;
        if (!passed && choice.next) {
          state.node = choice.next;
          state.mode = 'dialog';
          render();
          return;
        }
      }

      if (choice.next === 'end') {
        state.mode = 'scene';
        state.node = null;
        state.message = 'Die Situation wird klarer. Du gehst weiter.';
      } else {
        state.node = choice.next;
        state.mode = 'dialog';
      }

      render();
    }

    function doSpot(index) {
      const scene = STORY.scenes[state.scene];
      const spot = (scene.spots || [])[index];
      if (!spot) return;

      if (spot.action === 'goto') {
        state.scene = spot.target;
        state.message = `Du gehst nach ${spot.target}.`;
        state.mode = 'scene';
        state.node = null;
        render();
        return;
      }

      if (spot.action === 'talk') {
        state.mode = 'dialog';
        state.node = spot.node;
        state.message = '';
        render();
        return;
      }

      if (spot.flag) state.flags[spot.flag] = true;
      if (spot.item) giveItem(spot.item);
      if (spot.heal) state.hp = Math.min(10, state.hp + spot.heal);
      state.message = spot.message || 'Du schaust genauer hin.';
      render();
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;
      const index = Number(target.dataset.index || -1);

      if (action === 'spot') doSpot(index);
      if (action === 'choice') applyChoice(index);
      if (action === 'restart') {
        state.scene = STORY.start;
        state.hp = 10;
        state.money = 60;
        state.inventory = [];
        state.flags = {};
        state.message = 'Du bist wach. Was tust du?';
        state.node = null;
        state.mode = 'scene';
        render();
      }
    });

    render();
  </script>
</body>
</html>
