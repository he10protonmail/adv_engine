<!-- Enhancements script: accessibility, button defaults, and cleanup behaviors -->
<script>
(function(){
  'use strict';
  // Ensure existing buttons have explicit type="button" and observe future additions
  function setButtonTypes(root=document){
    root.querySelectorAll('button').forEach(b=>{ if(!b.hasAttribute('type')) b.setAttribute('type','button'); });
  }
  setButtonTypes(document);
  const mo=new MutationObserver(muts=>{
    for(const m of muts) for(const n of m.addedNodes){
      if(n.nodeType!==1) continue;
      if(n.tagName==='BUTTON' && !n.hasAttribute('type')) n.setAttribute('type','button');
      try{ n.querySelectorAll && n.querySelectorAll('button').forEach(b=>{ if(!b.hasAttribute('type')) b.setAttribute('type','button'); }); }catch(e){}
    }
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});

  // Mirror visible .msg content into sr-only region for screen readers
  const sr=document.getElementById('sr-msg');
  if(sr){
    const updateSr=()=>{ const el=document.querySelector('.msg')||document.getElementById('msg'); sr.textContent = el ? el.textContent : ''; };
    const msgObs=new MutationObserver(updateSr);
    msgObs.observe(document.body,{childList:true,subtree:true,characterData:true});
    // initial
    setTimeout(updateSr,300);
  }

  // Overlay focus & escape handling: set aria-hidden based on content and allow closing with ESC or clicking backdrop
  const ov=document.getElementById('ov');
  if(ov){
    const ovObs=new MutationObserver(()=>{ if(ov.innerHTML.trim()) { ov.setAttribute('aria-hidden','false'); const focusable=ov.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'); if(focusable) focusable.focus(); } else ov.setAttribute('aria-hidden','true'); });
    ovObs.observe(ov,{childList:true,subtree:true});
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ov.getAttribute('aria-hidden')==='false'){ ov.innerHTML=''; ov.setAttribute('aria-hidden','true'); } });
    ov.addEventListener('click', e=>{ if(e.target===ov){ ov.innerHTML=''; ov.setAttribute('aria-hidden','true'); } });
  }

  // Revoke created blob: URLs on unload to avoid leaking memory
  window.addEventListener('beforeunload', ()=>{
    try{ if(window.urls) Object.values(window.urls).forEach(u=>{ if(u && typeof u === 'string' && u.startsWith('blob:')) URL.revokeObjectURL(u); }); }catch(e){}
  });

  // Prevent global key handlers from triggering when typing in form controls
  document.addEventListener('keydown', e=>{ const active=document.activeElement; if(active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return; }, true);
})();
</script>
